<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">紫微斗数 Skill 技术架构 / Zi Wei Dou Shu skill architecture</title>
  <desc id="desc">从输入与校验，经由主题路由、原典知识和专题框架，到证据化输出；测试与安全边界横向贯穿。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6b37"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f4efe5"/>
  <rect x="28" y="28" width="1344" height="764" rx="18" fill="none" stroke="#d7c7a6" stroke-width="2"/>
  <path d="M72 112H1328" stroke="#d7c7a6" stroke-width="2"/>
  <text x="72" y="78" fill="#14233b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700">从问题到答案 · From question to answer</text>
  <text x="1328" y="78" text-anchor="end" fill="#8a6b37" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" letter-spacing="2">INPUT · EVIDENCE · REFLECTION</text>

  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
