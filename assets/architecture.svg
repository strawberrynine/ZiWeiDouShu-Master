    <text x="102" y="560" fill="#6a6254" font-size="13">结构顺序：命宫 / 身宫 → 三方四正与对宫 → 四化与辅煞 → 本命 / 大限 / 流年 → 反证</text>
    <text x="102" y="586" fill="#6a6254" font-size="13">Method: core palaces → relational field → transformations and modifiers → timing layers → counterevidence</text>

    <g>
