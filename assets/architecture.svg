    <g>
      <rect x="334" y="174" width="216" height="246" rx="12" fill="#fffaf0" stroke="#3b7c78" stroke-width="2.5"/>
      <circle cx="368" cy="214" r="20" fill="#3b7c78"/>
      <text x="368" y="221" text-anchor="middle" fill="#fffaf0" font-size="18" font-weight="700">02</text>
      <text x="368" y="274" fill="#14233b" font-size="21" font-weight="700">校验</text>
      <text x="368" y="301" fill="#8a6b37" font-size="14">Validation</text>
      <text x="358" y="345" fill="#14233b" font-size="13">字段、历法、时辰</text>
      <text x="358" y="370" fill="#14233b" font-size="13">命宫 / 身宫 / 十二宫</text>
      <text x="358" y="403" fill="#6a6254" font-size="12">schemas/*.json</text>
