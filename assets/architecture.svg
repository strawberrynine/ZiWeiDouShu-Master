      <circle cx="104" cy="214" r="20" fill="#b24f3d"/>
      <text x="104" y="221" text-anchor="middle" fill="#fffaf0" font-size="18" font-weight="700">01</text>
      <text x="104" y="274" fill="#14233b" font-size="21" font-weight="700">输入</text>
      <text x="104" y="301" fill="#8a6b37" font-size="14">Input</text>
      <text x="94" y="345" fill="#14233b" font-size="13">结构化命盘</text>
      <text x="94" y="370" fill="#14233b" font-size="13">出生资料 / 截图</text>
      <text x="94" y="403" fill="#6a6254" font-size="12">prompts/intake.md</text>
