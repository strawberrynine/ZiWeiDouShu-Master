      <text x="98" y="685" fill="#d1b475" font-size="15" font-weight="700">质量检查 · Quality</text>
      <text x="98" y="713" fill="#f4efe5" font-size="13">tests/test-cases.md · tests/evaluation-rubric.md</text>
