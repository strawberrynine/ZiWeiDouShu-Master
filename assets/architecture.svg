    </g>
    <g>
      <rect x="722" y="650" width="620" height="92" rx="10" fill="#b24f3d"/>
      <text x="750" y="685" fill="#fffaf0" font-size="15" font-weight="700">边界 · Guardrails</text>
      <text x="750" y="713" fill="#fffaf0" font-size="13">不作医疗、法律、投资或宿命式保证</text>
      <text x="750" y="735" fill="#fffaf0" font-size="12">No diagnosis, legal advice, financial advice, or deterministic claims.</text>
